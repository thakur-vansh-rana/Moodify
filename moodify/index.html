<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Emotion Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0f;
      --surface: #17171a;
      --border: #2a2a30;
      --text: #f0ede8;
      --muted: #7a7a85;
      --accent: #e8d5b0;
      --radius: 18px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 80px;
      background-image:
        radial-gradient(ellipse 70% 50% at 20% 10%, rgba(232,213,176,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 80% 90%, rgba(96,165,250,0.05) 0%, transparent 60%);
    }

    /* ── Header ── */
    header {
      text-align: center;
      margin-bottom: 52px;
    }
    header .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 5px 16px;
      margin-bottom: 22px;
    }
    header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.8rem);
      font-weight: 400;
      line-height: 1.1;
      color: var(--text);
    }
    header h1 em {
      font-style: italic;
      color: var(--accent);
    }
    header p {
      margin-top: 14px;
      font-size: 1rem;
      color: var(--muted);
      font-weight: 300;
      max-width: 420px;
      margin-inline: auto;
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,213,176,0.03) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ── Textarea ── */
    .textarea-wrap {
      position: relative;
    }
    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 300;
      line-height: 1.7;
      padding: 18px 20px;
      transition: border-color 0.2s;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .char-count {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: var(--muted);
      pointer-events: none;
    }

    /* ── Button ── */
    button.analyze {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0f;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.03em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    button.analyze:hover { opacity: 0.88; transform: translateY(-1px); }
    button.analyze:active { transform: translateY(0); }
    button.analyze:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Result ── */
    #result {
      margin-top: 32px;
      display: none;
      animation: fadeUp 0.4s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .primary-result {
      display: flex;
      align-items: center;
      gap: 20px;
      padding: 28px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 24px;
      transition: background 0.5s, border-color 0.5s;
    }
    .primary-emoji {
      font-size: 3.2rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .primary-label {
      font-family: 'DM Serif Display', serif;
      font-size: 2rem;
      font-weight: 400;
      text-transform: capitalize;
      margin-bottom: 4px;
    }
    .primary-conf {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .primary-conf span {
      color: var(--text);
      font-weight: 500;
    }

    /* ── Bars ── */
    .bars-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .bar-emoji { font-size: 1.1rem; width: 24px; text-align: center; flex-shrink: 0; }
    .bar-name {
      width: 68px;
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: capitalize;
      flex-shrink: 0;
    }
    .bar-track {
      flex: 1;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 100px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.6s cubic-bezier(.4,0,.2,1);
      width: 0%;
    }
    .bar-pct {
      width: 42px;
      text-align: right;
      font-size: 0.8rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    /* ── Error ── */
    #error {
      margin-top: 20px;
      display: none;
      padding: 14px 18px;
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.3);
      border-radius: 10px;
      color: #f87171;
      font-size: 0.9rem;
    }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(0,0,0,0.3);
      border-top-color: #0d0d0f;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Footer ── */
    footer {
      margin-top: 48px;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

  <header>
    <div class="badge">ML · Logistic Regression · TF-IDF</div>
    <h1>Detect the <em>emotion</em><br>behind your words</h1>
    <p>Enter any sentence and the model will classify it into one of six emotions in real time.</p>
  </header>

  <div class="card">
    <div class="textarea-wrap">
      <textarea id="inputText" placeholder="Type something like — I can't believe how happy I am today…" maxlength="500"></textarea>
      <span class="char-count" id="charCount">0 / 500</span>
    </div>

    <button class="analyze" id="analyzeBtn" onclick="analyze()">Analyse Emotion</button>

    <div id="error"></div>

    <div id="result">
      <div class="primary-result" id="primaryResult">
        <div class="primary-emoji" id="primaryEmoji"></div>
        <div>
          <div class="primary-label" id="primaryLabel"></div>
          <div class="primary-conf">Confidence: <span id="primaryConf"></span></div>
        </div>
      </div>

      <div class="bars-label">All emotion scores</div>
      <div id="barsContainer"></div>
    </div>
  </div>

  <footer>
    Powered by a Logistic Regression model + TF-IDF vectorizer &mdash; Backend: <a href="https://flask.palletsprojects.com/" target="_blank">Flask</a>
  </footer>

  <script>
    const API = "http://localhost:5000/predict";

    const textarea = document.getElementById("inputText");
    const charCount = document.getElementById("charCount");

    textarea.addEventListener("input", () => {
      charCount.textContent = `${textarea.value.length} / 500`;
    });

    textarea.addEventListener("keydown", e => {
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze();
    });

    async function analyze() {
      const text = textarea.value.trim();
      const btn = document.getElementById("analyzeBtn");
      const errEl = document.getElementById("error");
      const resultEl = document.getElementById("result");

      errEl.style.display = "none";
      resultEl.style.display = "none";

      if (!text) {
        showError("Please enter some text first.");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Analysing…';

      try {
        const res = await fetch(API, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        const data = await res.json();
        renderResult(data);
      } catch (err) {
        showError(`Could not reach the backend. Make sure app.py is running on port 5000.<br><small>${err.message}</small>`);
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Analyse Emotion";
      }
    }

    function renderResult(data) {
      // Primary result
      document.getElementById("primaryEmoji").textContent = data.emoji;
      document.getElementById("primaryLabel").textContent = data.emotion;
      document.getElementById("primaryConf").textContent = `${(data.confidence * 100).toFixed(1)}%`;

      const pr = document.getElementById("primaryResult");
      pr.style.background = hexAlpha(data.color, 0.08);
      pr.style.borderColor = hexAlpha(data.color, 0.3);
      document.getElementById("primaryLabel").style.color = data.color;

      // Bars
      const container = document.getElementById("barsContainer");
      container.innerHTML = "";
      data.all_scores.forEach(s => {
        const pct = (s.score * 100).toFixed(1);
        container.innerHTML += `
          <div class="bar-row">
            <div class="bar-emoji">${s.emoji}</div>
            <div class="bar-name">${s.emotion}</div>
            <div class="bar-track">
              <div class="bar-fill" style="background:${s.color}" data-width="${pct}"></div>
            </div>
            <div class="bar-pct">${pct}%</div>
          </div>`;
      });

      const resultEl = document.getElementById("result");
      resultEl.style.display = "block";

      // Animate bars after a tiny delay
      requestAnimationFrame(() => {
        document.querySelectorAll(".bar-fill").forEach(el => {
          el.style.width = el.dataset.width + "%";
        });
      });
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.innerHTML = msg;
      el.style.display = "block";
    }

    function hexAlpha(hex, alpha) {
      const r = parseInt(hex.slice(1,3),16);
      const g = parseInt(hex.slice(3,5),16);
      const b = parseInt(hex.slice(5,7),16);
      return `rgba(${r},${g},${b},${alpha})`;
    }
  </script>

</body>
</html>
